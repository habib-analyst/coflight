[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coflight"
version = "0.3.0"
description = "Co-failure ceiling estimation and cost break-even analysis for multi-model LLM systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "llm",
    "ensemble",
    "routing",
    "mixture-of-experts",
    "evaluation",
    "statistics",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=2.1",
]

[project.optional-dependencies]
# scipy is optional and never imported at runtime. It is used only by
# tests/test_numerics_vs_scipy.py, which checks the package's own incomplete
# beta implementation against a reference.
dev = ["pytest>=8.3", "scipy>=1.11"]

[project.scripts]
coflight = "coflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
